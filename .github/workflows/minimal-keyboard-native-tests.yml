name: Minimal keyboard native tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard-native:
    name: Swift keyboard layout and hit-testing
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        commit: [05c6dc481f3a380572c1d8f5a9c6cb65e115b332]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Run native keyboard layout and hit-testing tests
        run: python3 openwhispr-mobile/plugins/keyboard-extension/tests/run-keyboard-touch-tests.py
      - name: Run keyboard capitalization tests
        run: sh openwhispr-mobile/scripts/test-keyboard-capitalization.sh
