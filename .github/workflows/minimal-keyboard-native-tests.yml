name: Minimal keyboard native tests
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit to test (empty uses the workflow commit)
        required: false
        type: string
permissions:
  contents: read
jobs:
  keyboard-native:
    name: Swift keyboard layout and hit-testing
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Run native provider transport tests
        run: python3 openwhispr-mobile/modules/background-uploader/tests/run-provider-transport-tests.py
      - name: Run keyboard return resolver tests
        run: bash openwhispr-mobile/modules/app-group-storage/tests/run-return-target-tests.sh
      - name: Run hotkey dictation logic tests
        run: python3 openwhispr-mobile/plugins/hotkey-dictation/tests/run-hotkey-logic-tests.py
      - name: Run Live Activity resolver tests
        run: sh openwhispr-mobile/modules/live-activity/tests/run-resolver-tests.sh
      - name: Run native keyboard layout and hit-testing tests
        run: python3 openwhispr-mobile/plugins/keyboard-extension/tests/run-keyboard-touch-tests.py
      - name: Run keyboard capitalization tests
        run: sh openwhispr-mobile/scripts/test-keyboard-capitalization.sh
